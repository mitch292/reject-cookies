name: Fix Cookie Reports

on:
  repository_dispatch:
    types: [snapshots_ready]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: next-version
        run: |
          # Base the bump on the highest released tag, not main's manifest — earlier
          # automated PRs may be tagged but not yet merged.
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Latest tag: $LATEST_TAG, next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code to fix cookie reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COOKIE_API_TOKEN: ${{ secrets.COOKIE_API_TOKEN }}
          COOKIE_API_BASE: ${{ vars.COOKIE_API_BASE }}
          RUN_DATE: ${{ github.event.client_payload.run_date }}
          SNAPSHOT_COUNT: ${{ github.event.client_payload.snapshot_count }}
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          claude --print --dangerously-skip-permissions \
            --model claude-opus-5-5 \
            --max-turns 75 \
            "$(cat .github/prompts/fix-cookie-reports.md)"

      - name: Tag version if branch was pushed
        run: |
          # Only tag if the agent created a new branch with commits
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" = "main" ]; then
            echo "Still on main — agent did not create a branch. Skipping tag."
            exit 0
          fi

          VERSION=$(jq -r .version public/manifest.json)
          TAG="v${VERSION}"

          # A duplicate tag means the PR can never be released — fail loudly
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump the version on this PR to an unused version."
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged and pushed $TAG"
